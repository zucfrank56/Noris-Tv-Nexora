<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XuperTV - Streaming + Live TV</title>
    <link rel="stylesheet" href="style.css">
    <!-- HLS.js for HLS (.m3u8) playback support on web/VIDAA -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <div id="app" class="app-container">
        <!-- Sidebar Navigation -->
        <div id="sidebar" class="sidebar">
            <div class="brand">
                <h2>XuperTV</h2>
                <span>v2.0 Streaming</span>
            </div>
            <div class="nav-menu">
                <div class="nav-item focus" data-section="live" tabindex="0">
                    <span class="icon">📺</span> Directos / Cable
                </div>
                <div class="nav-item" data-section="movies" tabindex="0">
                    <span class="icon">🎬</span> Cine HD
                </div>
                <div class="nav-item" data-section="sports" tabindex="0">
                    <span class="icon">⚽</span> Deportes
                </div>
                <div class="nav-item" data-section="kids" tabindex="0">
                    <span class="icon">🍿</span> Infantiles
                </div>
                <div class="nav-item" data-section="doc" tabindex="0">
                    <span class="icon">🌍</span> Documentales
                </div>
                <div class="nav-item" data-section="lacartoons" tabindex="0">
                    <span class="icon">🎨</span> La Cartoons
                </div>
            </div>
            <div class="sidebar-footer">
                <p>XuperTV Edition</p>
            </div>
        </div>

        <!-- Main Content Area -->
        <div id="main-content" class="main-content">
            <div class="header-bar">
                <h1 id="section-title">Televisión en Vivo y Streaming</h1>
                <div class="clock-pill" id="clock">00:00</div>
            </div>

            <!-- Content Grid / Catalog -->
            <div id="catalog-grid" class="catalog-grid">
                <!-- Dynamic cards populated by app.js -->
            </div>
        </div>

        <!-- Video Player Overlay -->
        <div id="player-overlay" class="player-overlay hidden">
            <video id="video-player" controls autoplay></video>
            <div class="player-info" id="player-info">
                <h3 id="player-title">Reproduciendo...</h3>
                <p id="player-sub">Use las flechas del control remoto para navegar</p>
            </div>
            <div class="player-back-hint">Presione <b>VOLVER / BACK</b> para salir</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
